name: Scraper de precios

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (hora UTC)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
    inputs:
      modo:
        description: "Qué correr"
        type: choice
        options: [real, probe]
        default: real

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Consultar precios
        shell: bash
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          MODO="${{ inputs.modo || 'real' }}"
          case "$MODO" in
            probe)    python -m scrapers.travelpayouts_scraper --probe 2>&1 | tee data/ultima_corrida.txt ;;
            *)        python -m scrapers.travelpayouts_scraper 2>&1 | tee data/ultima_corrida.txt
                      python -m core.exportar_dashboard ;;
          esac

      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git add data/*.txt
          git config user.name "cazavuelos-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ inputs.modo || 'real' }}" = "real" ]; then git add data/cazavuelos.db public/panel/data.json public/ofertas.json; git add data/aerolineas.json 2>/dev/null || true; fi
          git diff --cached --quiet || git commit -m "datos: corrida $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
